name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest
      - name: Smoke tests (no checkpoint needed)
        run: |
          mkdir -p ci_logs
          python -m pytest tests/ -q --tb=short 2>&1 | tee ci_logs/pytest.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Quickstart example runs without checkpoint
        run: |
          PYTHONPATH=. python examples/quickstart_no_checkpoint.py 2>&1 | tee ci_logs/quickstart.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci_logs/*.log
          if-no-files-found: warn
